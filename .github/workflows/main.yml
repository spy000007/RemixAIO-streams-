name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix and Restructure AI Studio Project
      run: |
        # 1. Create .env file if missing
        if [ -f ".env.example" ]; then
          cp .env.example .env
        else
          echo "GEMINI_API_KEY=dummy_key_for_ci_build" > .env
        fi

        # 2. Setup directory structure
        mkdir -p gradle app

        # 3. Move version catalog
        if [ -f "libs.versions.toml" ]; then
          mv libs.versions.toml gradle/
        fi

        # 4. Move app code & configs to app/
        if [ -d "src" ]; then mv src app/; fi
        if [ -f "proguard-rules.pro" ]; then mv proguard-rules.pro app/; fi
        if [ -f "firebase-applet-config.json" ]; then mv firebase-applet-config.json app/; fi
        if [ -f ".env" ]; then cp .env app/.env; fi

        # 5. Move app build script
        if [ -f "build.gradle.kts" ]; then
          mv build.gradle.kts app/build.gradle.kts
        fi

        # 6. Create root build.gradle.kts
        touch build.gradle.kts

        # 7. Write settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AIOStreams"
        include(":app")
        EOF

        # 8. Clean app/build.gradle.kts of debugConfig line
        if [ -f "app/build.gradle.kts" ]; then
          sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          sed -i '/debugConfig/d' app/build.gradle.kts
        fi

    - name: Build Debug APK
      run: gradle :app:assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
