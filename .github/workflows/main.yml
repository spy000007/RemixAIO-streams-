name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix and Restructure AI Studio Project
      run: |
        # 1. Ensure .env file exists
        if [ -f ".env.example" ]; then
          cp .env.example .env
        else
          echo "GEMINI_API_KEY=dummy_key_for_ci_build" > .env
        fi

        # 2. Create required directories
        mkdir -p gradle app

        # 3. Move version catalog to gradle/
        if [ -f "libs.versions.toml" ]; then
          mv libs.versions.toml gradle/
        fi

        # 4. Move app source code & configuration files to app/
        if [ -d "src" ]; then mv src app/; fi
        if [ -f "proguard-rules.pro" ]; then mv proguard-rules.pro app/; fi
        if [ -f "firebase-applet-config.json" ]; then mv firebase-applet-config.json app/; fi
        cp .env app/.env

        # 5. Move app build script to app/
        if [ -f "build.gradle.kts" ]; then
          mv build.gradle.kts app/build.gradle.kts
        fi

        # 6. Clean invalid debugConfig & fix plugin aliases in app/build.gradle.kts
        if [ -f "app/build.gradle.kts" ]; then
          sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          sed -i '/debugConfig/d' app/build.gradle.kts
          
          # Convert plugin aliases to standard plugin IDs to fix Kotlin DSL resolution
          sed -i 's/alias(libs.plugins.android.application)/id("com.android.application")/g' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.kotlin.android)/id("org.jetbrains.kotlin.android")/g' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.kotlin.compose)/id("org.jetbrains.kotlin.plugin.compose")/g' app/build.gradle.kts
        fi

        # 7. Create root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        // Root build file
        EOF

        # 8. Create proper root settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "RemixAIO-streams"
        include(":app")
        EOF

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
