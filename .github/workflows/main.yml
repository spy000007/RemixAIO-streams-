name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Restructure AI Studio Project
      run: |
        mkdir -p gradle app
        
        # Move version catalog to gradle directory
        if [ -f "libs.versions.toml" ]; then
          mv libs.versions.toml gradle/
        fi

        # Move source code and resources to app directory
        if [ -d "src" ]; then mv src app/; fi
        if [ -f "proguard-rules.pro" ]; then mv proguard-rules.pro app/; fi
        if [ -f "firebase-applet-config.json" ]; then mv firebase-applet-config.json app/; fi

        # Move app build script to app/build.gradle.kts
        if [ -f "build.gradle.kts" ]; then
          mv build.gradle.kts app/build.gradle.kts
        fi

        # Create empty root build.gradle.kts
        touch build.gradle.kts

        # Configure settings.gradle.kts with :app module
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AIOStreams"
        include(":app")
        EOF

        # Remove unsupported signing config line if present
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' app/build.gradle.kts
        fi

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
