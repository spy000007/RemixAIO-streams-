name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Prepare Google AI Studio Project
      run: |
        # 1. Create .env file to prevent build script crash
        if [ -f ".env.example" ]; then
          cp .env.example .env
        else
          echo "GEMINI_API_KEY=dummy_key_for_ci_build" > .env
        fi

        # 2. Ensure version catalog is in gradle/ directory
        mkdir -p gradle
        if [ -f "libs.versions.toml" ]; then
          cp libs.versions.toml gradle/
        fi

        # 3. Clean settings.gradle.kts for Single Root Project
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "RemixAIO-streams"
        EOF

        # 4. Remove problematic signingConfig lines from build.gradle.kts
        if [ -f "build.gradle.kts" ]; then
          sed -i '/signingConfig/d' build.gradle.kts
          sed -i '/debugConfig/d' build.gradle.kts
        fi

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
        
